name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Advisory only: current highs are all in build tooling (astro/esbuild/
      # sharp/postcss), fixable only via a breaking Astro major. Dependabot
      # (.github/dependabot.yml) drives those upgrades; this surfaces new
      # advisories in the log without gating merges on unrelated transitives.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: site
        continue-on-error: true

  dao:
    name: Build dao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dao/package-lock.json
      - run: npm ci
        working-directory: dao
      - run: npm run build
        working-directory: dao
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: dao
        continue-on-error: true
