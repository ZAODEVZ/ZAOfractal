# Snapshot ballots (Sat 18:00 America/New_York)
# Frapp-GH lives in frapp-gh/ - workflows only execute from the repo root, so
# this drives the runner there. Cron is UTC (22:00 = 18:00 EDT) and does not
# follow US daylight saving; use 23:00 for a fixed local hour in winter.
name: Fractal snapshot

on:
  workflow_dispatch:
    inputs:
      period:
        description: Period number (blank = current cycle)
        required: false
      dry_run:
        description: Compute without writing
        type: boolean
        default: false
  schedule:
    - cron: "0 22 * * 6"

permissions:
  contents: write
  issues: write
  discussions: write

concurrency:
  group: frapp-gh-snapshot
  cancel-in-progress: false

defaults:
  run:
    working-directory: frapp-gh

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frapp-gh/package-lock.json

      - run: npm ci

      - name: Run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.FRAPP_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/cycle.ts snapshot \
            ${{ inputs.period && format('--week {0}', inputs.period) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          git config user.name "frapp-gh[bot]"
          git config user.email "frapp-gh@users.noreply.github.com"
          git add frapp-gh/.github/frapp-gh frapp-gh/public/leaderboard.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "chore(frapp-gh): snapshot period state"
            git push
          fi
