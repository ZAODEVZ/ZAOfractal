# Tests for frapp-gh/ only. Scoped by path so the rest of ZAOfractal is
# unaffected, and separate from the repo's own ci.yml.
name: frapp-gh CI

on:
  push:
    branches: [main]
    paths: ["frapp-gh/**"]
  pull_request:
    paths: ["frapp-gh/**"]

defaults:
  run:
    working-directory: frapp-gh

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frapp-gh/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
