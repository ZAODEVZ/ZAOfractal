name: App

on:
  push:
    branches: [main, app-capacitor]
    paths: ['app/**', 'site/src/lib/week.ts', '.github/workflows/app-android.yml']
  pull_request:
    paths: ['app/**', 'site/src/lib/week.ts', '.github/workflows/app-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests, types, web preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Bundled data matches the repo snapshot
        run: |
          npm run data
          git diff --exit-code -- src/data
      - run: npm test
      - run: npm run typecheck
      - run: npx expo-doctor
        continue-on-error: true
      - run: npm run export:web
      - name: Screenshots at phone size
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/app/scripts/screenshots.mjs" run.mjs
          node run.mjs "$GITHUB_WORKSPACE/app/dist" /tmp/shots/out
      - uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: /tmp/shots/out
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
      # The release variant bundles the JS, so the APK runs without a dev server.
      # The Expo template signs it with the debug keystore: fine for testers, not for Play.
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: zao-fractal-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
